# WorkTrackIQ backend - nginx reverse proxy (80 -> Node app on 3030)
# Place at /etc/nginx/conf.d/worktrackiq.conf (or sites-available + symlink), then:
#   sudo nginx -t && sudo systemctl reload nginx

upstream worktrack_backend {
    server 127.0.0.1:3030;   # Node app (PORT in backend/.env)
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;           # replace with your domain/IP if needed

    client_max_body_size 20m;

    access_log /var/log/nginx/worktrackiq_access.log;
    error_log  /var/log/nginx/worktrackiq_error.log;

    location / {
        proxy_pass http://worktrack_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
