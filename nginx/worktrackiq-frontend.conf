# Frontend (Flutter web) - /etc/nginx/sites-available/worktrackiq
# ln -s /etc/nginx/sites-available/worktrackiq /etc/nginx/sites-enabled/
server {
    server_name worktrackiq.impacgo.com;
    root /var/www/apps/WorkTrackIQ-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # Flutter routes
    }

    # Don't cache entry files, so new deploys show up
    location = /index.html                { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js              { add_header Cache-Control "no-cache"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/worktrackiq.impacgo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/worktrackiq.impacgo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name worktrackiq.impacgo.com;
    return 301 https://$host$request_uri;
}
