# Backend (Express on port 3030) - /etc/nginx/sites-available/worktrackiq-api
# ln -s /etc/nginx/sites-available/worktrackiq-api /etc/nginx/sites-enabled/
# Add a DNS A record for api.worktrackiq.impacgo.com, then run:
#   sudo certbot --nginx -d api.worktrackiq.impacgo.com
server {
    listen 80;
    server_name api.worktrackiq.impacgo.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
